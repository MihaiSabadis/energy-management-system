services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --log.level=DEBUG
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DEVICE_SERVICE_URL: http://device-service:8082
    ports:
      - "8081:8081"
    depends_on:
      user-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.users.rule=PathPrefix(`/api/users`)
      - traefik.http.routers.users.entrypoints=web
      - traefik.http.services.users.loadbalancer.server.port=8081

  device-service:
    build: ./device-service
    container_name: device-service
    environment:
      DB_URL: jdbc:postgresql://device-db:5432/device_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "8082:8082"
    depends_on:
      device-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.devices.rule=PathPrefix(`/api/devices`) && !PathPrefix(`/api/devices/assignments`)
      - traefik.http.routers.devices.entrypoints=web
      - traefik.http.services.devices.loadbalancer.server.port=8082

  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  device-db:
    image: postgres:16
    container_name: device-db
    environment:
      POSTGRES_DB: device_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - device-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d device_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  user-db-data:
  device-db-data:
  auth-db-data: