spring.application.name=auth-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/auth_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

user-service.url=${USER_SERVICE_URL:http://localhost:8081}

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
admin.email=${ADMIN_EMAIL:admin@ems.local}